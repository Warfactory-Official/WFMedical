plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neoforge_version

    // Mixin configs are declared in neoforge.mods.toml; NeoForge 1.21.1 runs on official names in
    // both dev and production, so no refmap / remapping step is needed any more.
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // JUnit against a bootstrapped Minecraft. MDG puts the `test` source set on the full MC classpath
    // and runs FML's JUnit bootstrap before the first test, so Bootstrap.bootStrap() has happened and
    // registries/DamageTypes/EntityTypes exist. That is what makes the hit-geometry maths testable
    // without launching a server -- the OBB slab test and the rig builder are pure functions of Vec3,
    // but they still need the Minecraft classes on the classpath to link.
    //
    // Split of responsibilities with the gametests in src/main/java/.../gametest:
    //   `./gradlew test`            -- geometry//maths that needs no world. Seconds, run on every change.
    //   `./gradlew runGameTestServer` -- anything needing a real LivingEntity, pose, or damage pipeline.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Developer-only: unlocks the WF Medical screen-effect debug key binds (toggle all effects /
            // verbose logging). Set only on dev client runs; shipped clients never get it, so players
            // cannot access it. Repeated on client1/client2 (MDG runs do not inherit from each other).
            systemProperty 'wfmedical.debug', 'true'
        }

        client1 {
            client()
            gameDirectory = project.file('run/client1')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'wfmedical.debug', 'true'
            programArguments.addAll '--username', 'Player1'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
        }

        client2 {
            client()
            gameDirectory = project.file('run/client2')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'wfmedical.debug', 'true'
            programArguments.addAll '--username', 'Player2'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

tasks.register('prepareDedicatedServer') {
    description = 'Accepts the EULA and forces offline mode for the dev dedicated server.'
    group = 'neoforge runs'

    doLast {
        def runDir = project.file('run')
        runDir.mkdirs()

        // Accept the EULA for the dev run directory.
        new File(runDir, 'eula.txt').text = 'eula=true\n'

        def propsFile = new File(runDir, 'server.properties')
        def overrides = ['online-mode': 'false', 'enforce-secure-profile': 'false']
        def lines = propsFile.exists() ? propsFile.readLines() : []
        overrides.each { key, value ->
            def i = lines.findIndexOf { it ==~ /\s*\Q${key}\E\s*=.*/ }
            if (i >= 0) { lines[i] = "${key}=${value}" } else { lines << "${key}=${value}" }
        }
        propsFile.text = lines.join('\n').stripTrailing() + '\n'
    }
}


tasks.matching { it.name in ['runServer', 'runGameTestServer'] }.configureEach {
    dependsOn 'prepareDedicatedServer'
}


tasks.register('runAll') {
    group = 'neoforge runs'
    description = 'Launch the offline server + both isolated clients together (multiplayer test).'

    dependsOn 'prepareDedicatedServer'

    doLast {
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')) {
            throw new GradleException('runAll is POSIX-only (uses ./gradlew and /proc); on Windows ' +
                    'launch runServer / runClient1 / runClient2 individually instead.')
        }


        def stopGames = { findWfmedicalGameJvms(project).each { it.destroy() }.size() }
        Runtime.runtime.addShutdownHook(new Thread({ stopGames() }))

        def procs = []
        def spawn = { String runTask ->
            def logFile = new File(project.projectDir, "run/${runTask}.out.log")
            def proc = new ProcessBuilder('./gradlew', runTask)
                    .directory(project.projectDir)
                    .redirectErrorStream(true)
                    .redirectOutput(logFile)
                    .start()
            procs << proc
            logger.lifecycle("  ▶ ${runTask}  →  ${logFile}")
            return [proc: proc, log: logFile]
        }

        try {

            def server = spawn('runServer')
            logger.lifecycle('Waiting for the dedicated server to accept connections…')
            boolean ready = false
            for (int i = 0; i < 180 && !ready; i++) {
                if (!server.proc.isAlive()) {
                    throw new GradleException("Dedicated server exited before it was ready – see ${server.log}")
                }
                ready = server.log.exists() && server.log.text.contains('! For help, type')
                if (!ready) { Thread.sleep(1000) }
            }
            if (!ready) {
                throw new GradleException("Server did not report ready within 180s – see ${server.log}")
            }
            logger.lifecycle('Server is up in offline mode. Launching both isolated clients…')

            spawn('runClient1')
            Thread.sleep(1500)
            spawn('runClient2')

            logger.lifecycle('Server + 2 clients running. Stop this task (Ctrl-C / IDE stop) to shut all three down.')
            procs.each { it.waitFor() }
        } finally {

            stopGames()
        }
    }
}


tasks.register('stopAll') {
    group = 'neoforge runs'
    description = 'Stop the offline server + both clients started by runAll.'
    doLast {
        def handles = findWfmedicalGameJvms(project)
        handles.each { it.destroy(); logger.lifecycle("stopped pid ${it.pid()}") }
        logger.lifecycle(handles.isEmpty() ? 'Nothing to stop.' : "Stopped ${handles.size()} process(es).")
    }
}


def findWfmedicalGameJvms(project) {
    def root = project.projectDir.absolutePath
    def markers = ['net.neoforged.dev.DedicatedServerLaunch', '--username Player1', '--username Player2']
    def handles = []
    new File('/proc').listFiles()?.each { dir ->
        if (!(dir.name ==~ /\d+/)) { return }
        try {
            def cmdlineFile = new File(dir, 'cmdline')
            if (!cmdlineFile.exists()) { return }
            def cmd = new String(cmdlineFile.bytes).replace('\u0000', ' ')
            if (cmd.contains(root) && markers.any { cmd.contains(it) }) {
                ProcessHandle.of(dir.name as long).ifPresent { handles << it }
            }
        } catch (ignored) {}
    }
    return handles
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // LDLib2 (UI framework).
    maven {
        name = 'FirstDarkDev'
        url = 'https://maven.firstdark.dev/snapshots'
    }
    // PlayerAnimator (KosmX).
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
    // CurseForge maven – hosts the unofficial TACZ 1.21.1 NeoForge port.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}

dependencies {
    // JUnit 5 for the unit-test source set. MDG supplies the Minecraft classpath and the FML
    // bootstrap; the engine itself is ours to declare.
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // LDLib2 – UI framework used for the character sheet, radial menu and HUD overlays.
    // The `all` classifier is the shaded jar LDLib2 documents for consumers.
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:${ldlib_version}:all"

    // PlayerAnimator (KosmX) – player animation library. The limb hitbox rig reads its animated bone
    // transforms so hitboxes track played animations instead of only the vanilla pose.
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}"

    // Soft TACZ compat only – no hard dependency, but the mixins need the classes at compile time.
    compileOnly "curse.maven:tacz-1-21-1-${tacz_curse_project}:${tacz_curse_file}"
    runtimeOnly "curse.maven:tacz-1-21-1-${tacz_curse_project}:${tacz_curse_file}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        // -PtestOutput surfaces System.out from a test; off by default because the FML bootstrap is loud.
        showStandardStreams = project.hasProperty('testOutput')
    }
}

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "ahf"
type = "required"
versionRange = "[1.0.4,2)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "wflib"
type = "required"
versionRange = "[1.8.38,2)"
ordering = "AFTER"
side = "BOTH"

# Dead bodies: the Corpse mod stores a dead player's or soldier's kit in a corpse entity (keepInventory off).
[[dependencies.${ mod_id }]]
modId = "corpse"
type = "optional"
versionRange = "[1.21.1-1.1.13,1.21.1-1.2)"
ordering = "AFTER"
side = "BOTH"

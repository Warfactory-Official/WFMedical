# Access transformers for Warfactory Medical.

# ServerPlayer.spawnInvulnerableTime is private and starts at 60, and ServerPlayer.hurt refuses any
# damage while it is above zero unless the source bypasses invulnerability. It only decays in
# ServerPlayer.tick, which FakePlayer overrides to a no-op, so a test-constructed player can never be
# damaged and the whole damage->trauma pipeline is untestable without widening this.
# Needed by gametest/TraumaPipelineGameTest. An AT only widens access; it changes no behaviour.
public net.minecraft.server.level.ServerPlayer spawnInvulnerableTime
